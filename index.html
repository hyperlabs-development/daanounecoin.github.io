
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daanoune Coin (DAAN)</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0e0e1a;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .btn {
      background-color: #1e90ff;
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1.5rem;
    }
    .btn:hover {
      background-color: #0073e6;
    }
    .contract {
      background-color: #1a1a2e;
      padding: 1rem;
      border-radius: 10px;
      word-break: break-all;
      margin: 1rem auto;
      max-width: 600px;
    }
    .links a {
      color: #1e90ff;
      margin: 0 1rem;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://gold-general-squid-415.mypinata.cloud/ipfs/bafkreicyxhmmjuto6q5lzohx4ogtbjzhnd3thqt2z2y5vj5p4wtcy4xqs4" alt="DAAN Logo">
  <h1>Daanoune Coin (DAAN)</h1>
  <p>A modern digital token designed to back a real-world productive project and empower a decentralized future.</p>
  <div class="contract">
    <strong>Contract Address:</strong><br>
    <code>PUT_YOUR_CONTRACT_ADDRESS_HERE</code>
  </div>
  <button class="btn" onclick="addToken()">Add to MetaMask</button>
  <div class="links" style="margin-top:2rem;">
    <a href="https://www.youtube.com/@ProMuscles" target="_blank">YouTube</a>
  </div>

  <script>
    async function addToken() {
      try {
        const wasAdded = await window.ethereum.request({
          method: 'wallet_watchAsset',
          params: {
            type: 'ERC20',
            options: {
              address: 'PUT_YOUR_CONTRACT_ADDRESS_HERE',
              symbol: 'DAAN',
              decimals: 18,
              image: 'https://gold-general-squid-415.mypinata.cloud/ipfs/bafkreicyxhmmjuto6q5lzohx4ogtbjzhnd3thqt2z2y5vj5p4wtcy4xqs4'
            },
          },
        });

        if (wasAdded) {
          alert('DAAN added to MetaMask!');
        } else {
          alert('Add token canceled.');
        }
      } catch (error) {
        console.log(error);
        alert('MetaMask not detected or an error occurred.');
      }
    }
  </script>
</body>
</html>
